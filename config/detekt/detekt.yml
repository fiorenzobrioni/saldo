# Detekt configuration for Saldo.
# Applied on top of the default config (buildUponDefaultConfig = true):
# only deviations from the defaults are listed here.

naming:
  FunctionNaming:
    # Composable functions use PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose design tokens (e.g. SaldoTypography) use PascalCase.
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    # Disabled: every hit was a justified literal (dp/sp values in
    # composables, palette colors, calendar math) and needed a @Suppress.
    active: false
  ReturnCount:
    # The CSV import parsers and row-resolution helpers read best as a chain of
    # early-return guards (bail on the first problem); the 2-return default only
    # produced noise there. Guard clauses are exempt and the ceiling is raised.
    max: 5
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

complexity:
  CyclomaticComplexMethod:
    # Compose UI is when-tree heavy by nature; the rule stays active for
    # domain and logic code, where high complexity is a real signal.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    # Disabled: Hilt constructors and pure functions take one parameter per
    # dependency/input by design; the rule only produced noise here.
    active: false
  TooManyFunctions:
    # Disabled: DAOs, repositories, editor ViewModels and the settings
    # registry naturally expose one function per query/field/preference.
    active: false
