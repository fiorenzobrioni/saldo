name: Release

# Builds the debug APK for a version tag and publishes it as a GitHub release.
# The APK is signed with the shared debug keystore committed in keystore/, so
# every release can be installed on top of the previous one without uninstalling.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt

      - name: Rename the APK
        id: apk
        run: |
          APK="saldo-${{ steps.version.outputs.version }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${{ steps.version.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${{ steps.version.outputs.tag }}" \
              "${{ steps.apk.outputs.path }}" \
              --title "Saldo ${{ steps.version.outputs.version }}" \
              --notes-file "$NOTES" \
              --verify-tag
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "${{ steps.apk.outputs.path }}" \
              --title "Saldo ${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi
