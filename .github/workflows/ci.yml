name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt

      # Minified and shrunk, so it is the only build where R8 problems (Room,
      # kotlinx.serialization, RemoteViews) can show up at all. Signed with the
      # committed debug key purely so it is installable for smoke tests - NOT a
      # release artifact (published releases are built by release.yml with the
      # real key). Keeps R8 exercised on every push, per ADR 47.
      - name: Build release APK (debug-signed, for testing only)
        run: ./gradlew :app:assembleRelease -PsignReleaseWithDebugKey

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-testing-only
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # The R8 map makes a release-build stack trace readable; without the run
      # that produced the APK it is gone.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      # The exported Room schemas (app/schemas) are generated by KSP during the
      # build. Development happens without a local Android SDK, so after a schema
      # bump the fresh <version>.json is taken from this artifact and committed.
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7
